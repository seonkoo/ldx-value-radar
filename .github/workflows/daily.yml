name: 每日更新蓝筹价值数据

on:
  schedule:
    # 服务端「试着」自动跑：GitHub Actions 的 cron 官方不保证触发（实测 13 次 0 触发），
    # 所以这只作双保险 / 备份，主力仍是本地 Windows 任务计划（见 scripts/daily_update.bat）。
    # 08:30 UTC = 16:30 北京时间，仅工作日；晚于本地 15:30 任务，降低两地同时推送冲突。
    - cron: "30 8 * * 1-5"
  workflow_dispatch:      # 手动触发，本地任务 / 定时都失效时的兜底
# 不监听 push：改代码时无需重跑约 150 秒的数据抓取，省 Actions 额度。

permissions:
  contents: write

concurrency:
  group: ldx-radar-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests

      - name: 构建数据
        id: build
        continue-on-error: true
        run: python scripts/build_data.py

      - name: 校验产物
        if: steps.build.outcome == 'success'
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('data/data.json', encoding='utf-8'))
          n = len(d.get('stocks', []))
          print(f"股票条目: {n}")
          if n < 50:
              print("::error::数据条目异常，拒绝提交")
              sys.exit(1)
          PY

      - name: 提交数据
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # valuation_cache.json 是乐咕挂掉时的降级依据，必须一起提交才能跨 run 持久化
          git add data/data.json data/valuation_cache.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 更新蓝筹价值数据 $(date +'%Y-%m-%d')"
            # 若本地任务已先推了新提交，先 rebase 再推，避免定时任务撞上非快进而跑红
            git pull --rebase origin main || true
            git push
          fi

      - name: 上传产物备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldx-data-${{ github.run_number }}
          path: data/data.json
          if-no-files-found: ignore
          retention-days: 7
