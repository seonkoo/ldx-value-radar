name: 每日更新蓝筹价值数据

on:
  workflow_dispatch:      # 仅手动触发，作为本地任务计划失效时的备份
# 刻意不再监听 schedule：GitHub Actions 的 cron 不保证触发，官方明确说明
# 负载高峰期会延迟甚至丢弃事件。本仓库实测 13 次运行记录中 schedule 触发 0 次。
# 数据更新已改由本地 Windows 任务计划执行 —— 见 scripts/daily_update.bat。
# 同样不监听 push：改代码时无需重跑约 150 秒的数据抓取，省 Actions 额度。

permissions:
  contents: write

concurrency:
  group: ldx-radar-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests

      - name: 构建数据
        id: build
        continue-on-error: true
        run: python scripts/build_data.py

      - name: 校验产物
        if: steps.build.outcome == 'success'
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('data/data.json', encoding='utf-8'))
          n = len(d.get('stocks', []))
          print(f"股票条目: {n}")
          if n < 50:
              print("::error::数据条目异常，拒绝提交")
              sys.exit(1)
          PY

      - name: 提交数据
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # valuation_cache.json 是乐咕挂掉时的降级依据，必须一起提交才能跨 run 持久化
          git add data/data.json data/valuation_cache.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 更新蓝筹价值数据 $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 上传产物备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldx-data-${{ github.run_number }}
          path: data/data.json
          if-no-files-found: ignore
          retention-days: 7
